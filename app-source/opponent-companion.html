<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opponent Female Companion — Basic Design Preview</title>
    <style>
      html,
      body,
      #companion-studio-root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #dad4cd;
      }
      .studio-controls {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 10;
        display: flex;
        gap: 8px;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .studio-controls button {
        border: 1px solid rgba(30, 30, 36, 0.16);
        background: rgba(255, 255, 255, 0.85);
        color: #1f1f24;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="studio-controls">
      <button onclick="window.__OPPONENT_COMPANION_SCENE__?.setPose('fashionStance')">Stance</button>
      <button onclick="window.__OPPONENT_COMPANION_SCENE__?.setPose('wave')">Wave</button>
      <button onclick="window.__OPPONENT_COMPANION_SCENE__?.setPose('neutral')">Neutral</button>
    </div>
    <div id="companion-studio-root"></div>
    <script type="module" src="/src/scene/opponentFemaleCompanionBasicScene.js"></script>
  </body>
</html>
